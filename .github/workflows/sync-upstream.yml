# 원작자 저장소(Jgaram/nikke-calc)의 master 브랜치를 매일 자동으로 fork로 병합.
# 병합 후 검증을 통과한 경우에만 push한다. 충돌/검증 실패는 GitHub 알림으로 확인한다.
#
# 브랜치: fork도 upstream도 master 사용 (v0.2 fix — 이전 v0.1은 main으로 잘못 지정되어 있었음)
#
# 별도 PAT 없이 작업별 GITHUB_TOKEN을 사용한다. 오래된 SYNC_TOKEN은 참조하지 않는다.

name: Sync from Jgaram/nikke-calc

on:
  schedule:
    - cron: "0 3 * * *"  # 매일 KST 12:00 (UTC 03:00)
  workflow_dispatch:  # 대시보드에서 수동 실행도 가능

concurrency:
  group: sync-upstream-master
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: master
          token: ${{ github.token }}

      - name: Add upstream + merge master
        run: |
          git config user.name "sync-bot"
          git config user.email "sync-bot@users.noreply.github.com"
          git remote add upstream https://github.com/Jgaram/nikke-calc.git
          git fetch upstream master
          git merge upstream/master --no-edit || {
            echo "::error::병합 실패 — 로컬에서 충돌을 해결하고 검증 후 반영하세요."
            exit 1
          }

      # GITHUB_TOKEN으로 push한 커밋은 별도 push CI를 시작하지 않으므로 여기서 검증한다.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: 문서·데이터 정합
        run: python -m runner.doclint

      - name: 딜 계산 회귀
        run: python -m runner.snapshot

      - name: 요청·결과 계약 검증
        run: |
          python -m pip install -r requirements.txt httpx==0.28.1
          python -c "from fastapi.testclient import TestClient; from api.main import app"
          python -m unittest discover -s tests -v

      - name: 검증된 병합 반영
        run: |
          git push origin master
